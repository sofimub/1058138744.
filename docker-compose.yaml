services:
    punto_a:
        image: python
        container_name: test
        ports:
            - "8089:8089"
        volumes:
            - .:/app/locustfile.py
        command: sh -c "pip install locust && locust -f /app/locustfile.py --web-host=0.0.0.0"

    punto_b:
        build: .
        container_name: par_impar
        command: node par_impar.js

    punto_c:
        image: php
        container_name: ingenieria_software_para_conquistar
        volumes:
            - ./mensaje.php:/mensaje.php
        command: php /mensaje.php

